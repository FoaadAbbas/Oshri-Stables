name: Keep Backend Alive

# Render free tier spins down after ~15 min idle. One request every 10 min keeps it warm.
# Vercel frontend does not "sleep"; only this backend URL needs pinging.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/health
        # Must match the API host in client/vercel.json (rewrites to Render)
        run: curl -fsS "https://oshri-stables.onrender.com/api/health"
